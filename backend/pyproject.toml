[project]
name = "voice-transcription-server"
version = "0.1.0"
description = "Local Whisper transcription server with CUDA support"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.18",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "nvidia-cudnn-cu12>=9.16.0.29",
    "nvidia-cublas-cu12>=12.9.1.4",
]

